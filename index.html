    <!-- Aplica el tema antes de pintar la página para evitar un destello del tema contrario. -->
    <script>
      function aplicarTemaInicial() {
        let temaGuardado = null;
        try {
          temaGuardado = localStorage.getItem("theme");
        } catch {
          // La página también funciona si el navegador bloquea el almacenamiento.
        }
        const usarTemaOscuro = temaGuardado === "dark"
          || (temaGuardado !== "light" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark-mode", usarTemaOscuro);
        document.documentElement.dataset.bsTheme = usarTemaOscuro ? "dark" : "light";
      }
      aplicarTemaInicial();
    </script>
    
  </head>

  <body>
    <div id="root"></div>
